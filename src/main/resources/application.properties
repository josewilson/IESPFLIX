spring.application.name=IESPFLIX

# Configuracoes de erro
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# PostgreSQL (padrao). Para H2 local use --spring.profiles.active=dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iespflix}
spring.datasource.username=${DB_USER:iespflix}
spring.datasource.password=${DB_PASSWORD:iespflix}

# Schema versionado pelo Flyway; Hibernate apenas valida
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# JPA specific configs
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql=true

# Swagger / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.default-flat-param-object=true

# Integracao ViaCEP
viacep.url=https://viacep.com.br/ws

# Logging com Correlation-ID
logging.pattern.console=%d{HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n

# JWT (JWT_SECRET obrigatório, mínimo 32 caracteres; nunca versionar o valor)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
