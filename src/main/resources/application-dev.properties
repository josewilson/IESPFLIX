# Perfil dev: H2 em arquivo, schema via Hibernate, sem Flyway.
# Uso: --spring.profiles.active=dev
spring.datasource.url=jdbc:h2:file:~/teckback20262;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=true

# Segredo fixo SOMENTE para desenvolvimento local (em producao use JWT_SECRET)
app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only-0123456789}
